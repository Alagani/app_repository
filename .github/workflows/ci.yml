name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege default; individual jobs elevate only what they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPO: myapp-repo

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  build-and-push:
    name: Build, scan, push image
    needs: test
    runs-on: ubuntu-latest
    # Only build/publish from main — PRs are validated but never produce a
    # publishable artifact, so a fork/PR can't push images under this name.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Docker Hub access token (Account Settings -> Security), not the
      # account password. DOCKERHUB_USERNAME is a repo variable (not a
      # secret — a username isn't sensitive).
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        run: |
          IMAGE_NAME="${{ vars.DOCKERHUB_USERNAME }}/${IMAGE_REPO}"
          echo "image_ref=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # Git-sha tag by convention. Unlike ECR, Docker Hub has no
      # image_tag_mutability=IMMUTABLE setting — nothing server-side stops
      # a duplicate tag push, so never reuse a tag by hand. update-gitops
      # (below) is what actually deploys this tag; nothing here touches the
      # cluster.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image_ref }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ${{ steps.meta.outputs.image_ref }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  update-gitops:
    name: Open image-bump PR in gitops repo
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: Alagani/argocd_repository
          # Fine-grained PAT (repo-scoped to argocd_repository only) with
          # Contents: Read and write (to open the PR) and Pull requests:
          # Read and write (to auto-merge it). A GitHub App installation
          # token is the preferred alternative for org-wide use — ask CTO
          # before adopting.
          token: ${{ secrets.GITOPS_PAT }}
          path: argocd_repository

      - name: Bump prod image tag
        working-directory: argocd_repository/apps/fastapi-app/overlays/prod
        run: |
          curl -sSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          yq -i '(.images[] | select(.name == "fastapi-app") | .newTag) = "${{ github.sha }}"' kustomization.yaml

      # Never push directly to the gitops repo's main branch — a PR keeps
      # the deploy diff reviewable in git history, even though nothing here
      # waits on a human to click it.
      - name: Open pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITOPS_PAT }}
          path: argocd_repository
          branch: bump/fastapi-app-${{ github.sha }}
          title: "chore: bump fastapi-app to ${{ github.sha }}"
          commit-message: "chore: bump fastapi-app image to ${{ github.sha }}"
          body: |
            Automated image bump from fastapi-app@${{ github.sha }}
            Source workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: automated-deploy

      # This is the only environment, and it's fully automated end-to-end:
      # this step only starts GitHub's native auto-merge, which still waits
      # for argocd_repository's validate.yml checks to pass before actually
      # merging — it does not bypass them. Requires "Allow auto-merge"
      # enabled in that repo's Settings > General, and validate.yml's jobs
      # set as required status checks on its main branch (Settings >
      # Branches).
      - name: Enable auto-merge on the bump PR
        if: steps.cpr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ secrets.GITOPS_PAT }}
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}" --repo Alagani/argocd_repository
