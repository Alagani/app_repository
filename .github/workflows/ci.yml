name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege default; individual jobs elevate only what they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: docker.io/jaga9989/simple-python-app

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  build-and-push:
    name: Build, scan, push image
    needs: test
    runs-on: ubuntu-latest
    # Only build/publish from main — PRs are validated but never produce a
    # publishable artifact, so a fork/PR can't push images under this name.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Docker Hub access token (not your account password), scoped to this
      # repo only, stored as DOCKERHUB_TOKEN — see repo Settings > Secrets.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        run: echo "image_ref=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # Immutable, content-addressed tag — never ':latest'. The Kubernetes
      # manifest in the GitOps repo pins to this exact tag.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ${{ steps.meta.outputs.image_ref }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  update-gitops:
    name: Open image-bump PR in gitops repo
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: Alagani/argocd_repository
          # Fine-grained PAT (repo-scoped, contents:write on argocd_repository
          # only) stored as a repo secret. A GitHub App installation token is
          # the preferred alternative for multi-repo/org setups.
          token: ${{ secrets.GITOPS_PAT }}
          path: argocd_repository

      - name: Bump dev image tag
        working-directory: argocd_repository/apps/fastapi-app/overlays/dev
        run: |
          curl -sSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          yq -i '(.images[] | select(.name == "fastapi-app") | .newTag) = "${{ github.sha }}"' kustomization.yaml

      # Never push directly to the gitops repo's main branch — a PR keeps the
      # deploy diff reviewable and lets branch protection / CODEOWNERS gate it.
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITOPS_PAT }}
          path: argocd_repository
          branch: bump/fastapi-app-dev-${{ github.sha }}
          title: "chore(dev): bump fastapi-app to ${{ github.sha }}"
          commit-message: "chore(dev): bump fastapi-app image to ${{ github.sha }}"
          body: |
            Automated image bump from fastapi-app@${{ github.sha }}
            Source workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: automated-deploy
